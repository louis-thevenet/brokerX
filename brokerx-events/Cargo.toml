[package]
name = "brokerx-events"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "0.24", features = ["aio", "tokio-comp", "connection-manager"] }
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
color-eyre = "0.6"
metrics = "0.23"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
