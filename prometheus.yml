global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  # - "first.rules"
  # - "second.rules"

scrape_configs:
  - job_name: api-gateway
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: user-service
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['user-service:3001']

  - job_name: order-service
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['order-service:3002']

  - job_name: market-data-service
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['market-data-service:3003']

  - job_name: api-gateway-system
    metrics_path: '/v1/metrics/system'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: user-service-system
    metrics_path: '/v1/metrics/system'
    static_configs:
      - targets: ['user-service:3001']

  - job_name: order-service-system
    metrics_path: '/v1/metrics/system'
    static_configs:
      - targets: ['order-service:3002']

  - job_name: market-data-service-system
    metrics_path: '/v1/metrics/system'
    static_configs:
      - targets: ['market-data-service:3003']
