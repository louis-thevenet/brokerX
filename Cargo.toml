[workspace]
members = [ 
    "notification-service", 
    "user-service",
    "order-service",
    "market-data-service",
    "api_gateway",
    "event-store-service",
    "brokerx-events"
]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/louis-thevenet/brokerX"
authors = ["Louis Thevenet <louis.tvnt@gmail.com>"]
license = "MIT"

[profile.release]
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
