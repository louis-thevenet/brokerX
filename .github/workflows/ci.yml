name: CI # Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      # User Service Database
      user-db:
        image: postgres:15
        env:
          POSTGRES_DB: brokerx_users
          POSTGRES_USER: brokerx_user
          POSTGRES_PASSWORD: password123
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U brokerx_user -d brokerx_users"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
        ports:
          - 5432:5432
      
      # Order Service Database
      order-db:
        image: postgres:15
        env:
          POSTGRES_DB: brokerx_orders
          POSTGRES_USER: brokerx_user
          POSTGRES_PASSWORD: password123
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U brokerx_user -d brokerx_orders"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
        ports:
          - 5433:5432
      
      # Market Data Service Database
      market-data-db:
        image: postgres:15
        env:
          POSTGRES_DB: brokerx_market_data
          POSTGRES_USER: brokerx_user
          POSTGRES_PASSWORD: password123
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U brokerx_user -d brokerx_market_data"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
        ports:
          - 5434:5432
      
      # Event Store Service Database (NEW - for event-driven architecture)
      event-store-db:
        image: postgres:15
        env:
          POSTGRES_DB: brokerx_event_store
          POSTGRES_USER: brokerx_user
          POSTGRES_PASSWORD: password123
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U brokerx_user -d brokerx_event_store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
        ports:
          - 5435:5432
      
      # Redis (NEW - for event pub/sub)
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Install PostgreSQL client and Redis CLI
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools
      
      - name: Initialize databases
        run: |
          PGPASSWORD=password123 psql -h localhost -p 5432 -U brokerx_user -d brokerx_users -f docker/init-user-db.sql
          PGPASSWORD=password123 psql -h localhost -p 5433 -U brokerx_user -d brokerx_orders -f docker/init-order-db.sql
          PGPASSWORD=password123 psql -h localhost -p 5434 -U brokerx_user -d brokerx_market_data -f docker/init-market-data-db.sql
          PGPASSWORD=password123 psql -h localhost -p 5435 -U brokerx_user -d brokerx_event_store -f docker/init-event-store-db.sql
        env:
          PGPASSWORD: password123
      
      - name: Run tests
        run: cargo test --all-features --workspace
        env: 
          CI: true
          # Service-specific database URLs (each service uses its own database)
          USER_DATABASE_URL: postgresql://brokerx_user:password123@localhost:5432/brokerx_users
          ORDER_DATABASE_URL: postgresql://brokerx_user:password123@localhost:5433/brokerx_orders
          MARKET_DATA_DATABASE_URL: postgresql://brokerx_user:password123@localhost:5434/brokerx_market_data
          EVENT_STORE_DATABASE_URL: postgresql://brokerx_user:password123@localhost:5435/brokerx_event_store
          DATABASE_URL: postgresql://brokerx_user:password123@localhost:5432/brokerx_users
          REDIS_URL: redis://localhost:6379
          EVENT_STORE_URL: http://localhost:3005
      
      - name: Test event architecture connectivity
        run: |
          # Test Redis connectivity
          redis-cli -h localhost -p 6379 ping
          # Test database connections
          PGPASSWORD=password123 psql -h localhost -p 5435 -U brokerx_user -d brokerx_event_store -c "SELECT 'Event Store DB connected' as status;"
        env:
          PGPASSWORD: password123


  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check

